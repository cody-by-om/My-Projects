<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Navigation -->
    <header class="navbar">

        <nav class="nav-left">
            <a href="#">About</a>
            <a href="#">Store</a>
        </nav>

        <nav class="nav-right">
            <a href="#">Gmail</a>
            <a href="#">Images</a>

            <button class="apps-btn" aria-label="Google Apps">
                ⋮⋮⋮
            </button>

            <button class="profile-btn" aria-label="Profile">
                O
            </button>
        </nav>

    </header>


    <!-- Main Search Area -->
    <main class="main">

        <!-- Logo -->
        <div class="logo" aria-label="Google">
            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>
        </div>


        <!-- Search Box -->
        <form class="search-form" id="searchForm">

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input type="text" id="searchInput" placeholder="Search" autocomplete="off">

                <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear search">
                    ×
                </button>

                <button type="button" class="mic-btn" aria-label="Voice Search">
                    🎙️
                </button>

            </div>


            <!-- Search Buttons -->
            <div class="search-buttons">

                <button type="submit">
                    Google Search
                </button>

                <button type="button" id="luckyBtn">
                    I'm Feeling Lucky
                </button>

            </div>

        </form>


        <!-- Language Section -->
        <div class="languages">

            <span>Google offered in:</span>

            <a href="#">हिन्दी</a>
            <a href="#">বাংলা</a>
            <a href="#">తెలుగు</a>
            <a href="#">मराठी</a>
            <a href="#">தமிழ்</a>
            <a href="#">ગુજરાતી</a>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="country">
            India
        </div>

        <div class="footer-links">

            <div>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>

            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
